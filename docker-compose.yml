version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: sunline-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sunline
      POSTGRES_PASSWORD: sunline
      POSTGRES_DB: sunline_db
    ports:
      - "15432:5432"
    volumes:
      - sunline_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: sunline-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - sunline_redis_data:/data

volumes:
  sunline_pg_data:
  sunline_redis_data:
